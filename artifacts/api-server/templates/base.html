<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Генератор прямых ссылок{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/style.css"/>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563EB',
            danger: '#DC2626',
            warning: '#D97706',
            success: '#16A34A',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex">

<!-- Sidebar -->
<aside id="sidebar" class="sidebar bg-white border-r border-gray-200 flex flex-col h-screen sticky top-0 transition-all duration-200" style="width:220px;min-width:220px;">
  <div class="flex items-center justify-between px-4 py-4 border-b border-gray-100">
    <span class="font-semibold text-sm text-gray-700 sidebar-label">Прямые ссылки</span>
    <button id="sidebar-toggle" class="text-gray-400 hover:text-gray-700 p-1 rounded" title="Свернуть">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12h18M3 6h18M3 18h18"/>
      </svg>
    </button>
  </div>
  <nav class="flex-1 py-3 overflow-y-auto">
    <a href="/" class="nav-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-600 hover:bg-blue-50 hover:text-blue-700 {% if request.url.path == '/' %}bg-blue-50 text-blue-700 font-medium{% endif %}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span class="sidebar-label">История партий</span>
    </a>
    <a href="/batch/new" class="nav-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-600 hover:bg-blue-50 hover:text-blue-700 {% if request.url.path == '/batch/new' %}bg-blue-50 text-blue-700 font-medium{% endif %}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <span class="sidebar-label">Новая партия</span>
    </a>
    <a href="/logs" class="nav-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-600 hover:bg-blue-50 hover:text-blue-700 {% if request.url.path == '/logs' %}bg-blue-50 text-blue-700 font-medium{% endif %}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span class="sidebar-label">Логи</span>
    </a>
    <a href="/settings" class="nav-link flex items-center gap-3 px-4 py-2.5 text-sm text-gray-600 hover:bg-blue-50 hover:text-blue-700 {% if request.url.path == '/settings' %}bg-blue-50 text-blue-700 font-medium{% endif %}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span class="sidebar-label">Настройки</span>
    </a>
  </nav>
  <div class="border-t border-gray-100 px-4 py-3">
    <div class="flex items-center gap-2 text-xs text-gray-500 sidebar-label">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>{{ user }}</span>
    </div>
  </div>
</aside>

<!-- Main -->
<div id="main-content" class="flex-1 flex flex-col min-h-screen overflow-x-hidden">
  <!-- Topbar -->
  <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between sticky top-0 z-10">
    <h1 class="text-base font-semibold text-gray-800">{% block page_title %}{% endblock %}</h1>
    <div class="flex items-center gap-4">
      <span class="text-sm text-gray-500">{{ user }}</span>
      <a href="/logout" class="text-sm text-red-500 hover:text-red-700">Выйти</a>
    </div>
  </header>

  <!-- Content -->
  <main class="flex-1 p-6">
    {% block content %}{% endblock %}
  </main>
</div>

<!-- Fullscreen viewer -->
<div id="viewer-overlay" class="fixed inset-0 bg-black/90 z-50 hidden flex-col items-center justify-center" onclick="viewerClose(event)">
  <button class="absolute top-4 right-4 text-white text-2xl hover:text-gray-300 z-10" onclick="closeViewer()">✕</button>
  <button class="absolute left-4 top-1/2 -translate-y-1/2 text-white text-3xl hover:text-gray-300 z-10 px-3 py-2" onclick="viewerNav(-1)">‹</button>
  <button class="absolute right-4 top-1/2 -translate-y-1/2 text-white text-3xl hover:text-gray-300 z-10 px-3 py-2" onclick="viewerNav(1)">›</button>
  <img id="viewer-img" src="" class="max-w-[90vw] max-h-[80vh] object-contain rounded shadow-2xl" alt=""/>
  <div class="mt-4 text-white text-center space-y-1">
    <div id="viewer-article" class="text-gray-300 text-sm"></div>
    <div id="viewer-filename" class="font-medium"></div>
    <div id="viewer-info" class="text-gray-400 text-sm"></div>
    <div id="viewer-errors" class="text-red-400 text-sm"></div>
    <a id="viewer-orig-link" href="#" target="_blank" class="inline-block mt-2 text-blue-400 hover:text-blue-300 text-sm">Открыть оригинал</a>
  </div>
</div>

<script src="/static/js/viewer.js"></script>
<script>
  // Sidebar collapse
  const sidebar = document.getElementById('sidebar');
  const labels = document.querySelectorAll('.sidebar-label');
  const toggle = document.getElementById('sidebar-toggle');
  let collapsed = localStorage.getItem('sidebar-collapsed') === '1';
  function applySidebar() {
    if (collapsed) {
      sidebar.style.width = '56px';
      sidebar.style.minWidth = '56px';
      labels.forEach(l => l.classList.add('hidden'));
    } else {
      sidebar.style.width = '220px';
      sidebar.style.minWidth = '220px';
      labels.forEach(l => l.classList.remove('hidden'));
    }
  }
  applySidebar();
  toggle.addEventListener('click', () => {
    collapsed = !collapsed;
    localStorage.setItem('sidebar-collapsed', collapsed ? '1' : '0');
    applySidebar();
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
