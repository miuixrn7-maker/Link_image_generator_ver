kind = "api"
previewPath = "/"
title = "Генератор прямых ссылок"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 5000
name = "API Server"
paths = ["/"]

[services.development]
run = "cd /home/runner/workspace/artifacts/api-server && PORT=5000 python -m uvicorn main:app --host 0.0.0.0 --port 5000 --reload"

[services.production]

[services.production.build]
args = ["echo", "no-build"]

[services.production.run]
args = ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "5000"]

[services.production.run.env]
PORT = "5000"

[services.production.health.startup]
path = "/login"
